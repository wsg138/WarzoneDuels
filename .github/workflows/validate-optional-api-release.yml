name: Validate durable optional API release

on:
  pull_request:
    branches:
      - agent/fix-optional-api-compatibility

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out validation branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run clean test and package lifecycle
        run: mvn -B clean verify

      - name: Verify release artifact and dependency isolation
        shell: bash
        run: |
          set -euo pipefail
          jar_path="target/WarzoneDuels-1.0.1.jar"
          test -f "$jar_path"
          jar tf "$jar_path" | grep -q '^plugin.yml$'
          jar tf "$jar_path" | grep -q '^dev/minecraft/warzoneduels/WarzoneDuelsPlugin.class$'
          unzip -p "$jar_path" plugin.yml | grep -q '^version: 1.0.1$'
          ! jar tf "$jar_path" | grep -Eq '^(com/djrapitops/plan|net/milkbowl/vault|com/github/sirblobman/combatlogx|org/enthusia)/'
          javap -classpath target/classes -verbose dev.minecraft.warzoneduels.adapter.plan.PlanHook \
            | grep -q 'InterfaceMethodref.*CapabilityService.getInstance'
          mvn -B -q dependency:tree -DoutputFile=target/dependency-tree.txt
          ! grep -Eq 'org\.enthusia|VaultAPI|combatlogx|com\.github\.plan-player-analytics' target/dependency-tree.txt
          sha256sum "$jar_path"

      - name: Remove validation-only files
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/validate-optional-api-release.yml
          rm -rf .validation
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'ci: remove optional API release validation files'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

      - name: Upload production JAR
        uses: actions/upload-artifact@v4
        with:
          name: WarzoneDuels-1.0.1-durable
          path: target/WarzoneDuels-1.0.1.jar
          if-no-files-found: error
          retention-days: 14
