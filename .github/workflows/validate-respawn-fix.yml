name: Validate defeated respawn fix

on:
  pull_request:
    branches:
      - agent/fix-defeated-respawn-guard
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: write

jobs:
  validate-and-apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/apply-respawn-lifecycle-fix'
    runs-on: ubuntu-latest
    steps:
      - name: Check out validation branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Apply lifecycle-safe source patch
        run: python3 scripts/apply_respawn_lifecycle_fix.py

      - name: Check patch integrity
        run: git diff --check

      - name: Run tests and build shaded jar
        run: mvn -B -ntp clean verify

      - name: Verify plugin artifact
        shell: bash
        run: |
          test -f target/WarzoneDuels-1.0-SNAPSHOT.jar
          jar tf target/WarzoneDuels-1.0-SNAPSHOT.jar | grep -qx 'plugin.yml'
          cp target/WarzoneDuels-1.0-SNAPSHOT.jar target/WarzoneDuels-1.0.0-respawn-fix.jar
          sha256sum target/WarzoneDuels-1.0.0-respawn-fix.jar

      - name: Commit validated source fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: exclude defeated player during victory moment'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

      - name: Upload validated jar
        uses: actions/upload-artifact@v4
        with:
          name: WarzoneDuels-1.0.0-respawn-fix
          path: target/WarzoneDuels-1.0.0-respawn-fix.jar
          if-no-files-found: error
          retention-days: 14
